<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
		/>
		<meta name="robots" content="noindex, nofollow" />
		<title>Offline – Kosten</title>
		<style>
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
				color: #fff;
				background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #818cf8 100%);
			}
			.card {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1rem;
				max-width: 22rem;
				text-align: center;
			}
			.logo {
				padding: 1.25rem;
				border-radius: 1.5rem;
				background: rgba(255, 255, 255, 0.1);
				backdrop-filter: blur(10px);
				box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
			}
			.logo img {
				width: 64px;
				height: 64px;
				object-fit: contain;
				display: block;
			}
			h1 {
				margin: 0.5rem 0 0;
				font-size: 1.375rem;
				font-weight: 700;
			}
			p {
				margin: 0;
				font-size: 0.95rem;
				line-height: 1.5;
				color: rgba(255, 255, 255, 0.9);
			}
			button {
				margin-top: 0.75rem;
				padding: 0.75rem 1.75rem;
				font-size: 1rem;
				font-weight: 600;
				color: #4f46e5;
				background: #fff;
				border: none;
				border-radius: 0.875rem;
				cursor: pointer;
				transition: transform 0.1s ease;
			}
			button:active {
				transform: scale(0.96);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="logo">
				<img src="/icon-192.png" alt="Kosten-Tool Logo" width="64" height="64" />
			</div>
			<h1>Keine Verbindung</h1>
			<p>Die App ist gerade offline. Sobald du wieder verbunden bist, geht es weiter.</p>
			<button type="button" onclick="location.reload()">Erneut versuchen</button>
		</div>
	</body>
</html>
